<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catégorie | Haiti Digital Store</title>
  <meta name="description" content="Page catégorie de Haiti Digital Store.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="../index.html">HDS<span>.</span></a>
    <nav>
      <a href="../index.html">Accueil</a>
      <a href="services.html">Services</a>
      <a href="category.html?category=gaming">Jeux vidéo</a>
      <a href="category.html?category=gift-cards">Cartes cadeaux</a>
      <a href="category.html?category=entertainment">Divertissement</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="hds-btn-cart" type="button" onclick="UI.showCart()">🛒 Panier <span id="hds-cart-count">0</span></button>
      <button class="hds-menu-btn" type="button" onclick="UI.toggleMenu()" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main style="padding: 64px 7% 90px;">
    <section class="section" style="padding: 0;">
      <div id="hds-products-container"></div>
      <div id="hds-cart-container" style="display: none;"></div>
    </section>
  </main>

  <script src="../config/site-config.js"></script>
  <script src="../data/products-data.js"></script>
  <script src="../js/cart-system.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const categoryId = params.get('category') || 'gaming';
      UI.init();
      UI.showCategory(categoryId);
    });
  </script>
</body>
</html>
